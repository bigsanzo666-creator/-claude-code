# 렌더(Render) 배포 청사진.
#
# 이 파일이 저장소에 있으면 렌더가 읽어서 서비스를 알아서 만든다.
# 사장님이 화면에서 눌러야 하는 단계를 줄이려는 것이다.
#
# 다른 플랫폼을 쓰더라도 Dockerfile 은 그대로 쓸 수 있다.
# 이 파일은 렌더에만 해당한다.
services:
  - type: web
    name: neulbomsaju
    runtime: docker
    dockerfilePath: ./Dockerfile
    # 한국에서 가장 가까운 지역
    region: singapore
    # 렌더는 요금제를 사양 이름으로 부른다. 0.5 CPU / 512MB = 예전의 Starter, 월 $7.
    # 우리 서버는 요청당 하는 일이 적고 상태를 메모리에 거의 안 들고 있어 이 사양으로 충분하다.
    # 무료 요금제(free)를 쓰지 않는 이유: 15분 놀면 잠들고, 심사자가 열었을 때
    # 잠들어 있으면 "접속 불가"로 반려된다.
    plan: 0.5c-512mb
    healthCheckPath: /healthz
    envVars:
      # 사업자 정보 — 렌더 대시보드에서 값을 채운다.
      # 저장소에 넣지 않는 이유는 개인정보이기 때문이고,
      # 신청서가 바뀔 때 배포를 다시 하지 않으려는 이유도 있다.
      - key: SITE_NAME
        sync: false
      - key: SITE_URL
        sync: false
      - key: BIZ_COMPANY
        sync: false
      - key: BIZ_REPRESENTATIVE
        sync: false
      - key: BIZ_REG_NUMBER
        sync: false
      - key: BIZ_MAIL_ORDER_NUMBER
        sync: false
      - key: BIZ_ADDRESS
        sync: false
      - key: BIZ_PHONE
        sync: false
      - key: BIZ_EMAIL
        sync: false
      - key: BIZ_HOSTING
        value: Render Services, Inc.
      # 아래 넷은 PG 계약과 API 키가 나온 뒤에 채운다.
      # 비어 있으면 결제와 리포트가 꺼진 채로 뜬다 (심사 대기 모드).
      - key: PORTONE_API_SECRET
        sync: false
      - key: PORTONE_STORE_ID
        sync: false
      - key: PORTONE_CHANNEL_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
